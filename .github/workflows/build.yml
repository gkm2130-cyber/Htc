name: Build AR9271 GKI Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies and repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 repo build-essential bc bison flex libssl-dev rsync zip binutils

      - name: Sync android14-6.1 GKI kernel source
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          mkdir kernel && cd kernel
          URL=$(echo "aHR0cHM6Ly9hbmRyb2lkLmdvb2dsZXNvdXJjZS5jb20va2VybmVsL21hbmlmZXN0" | base64 -d)
          repo init -u "$URL" -b common-android14-6.1 --depth=1
          repo sync -c -j$(nproc)

      - name: Configure ath9k_htc modules
        run: |
          cd kernel
          sed -i '/CONFIG_LEDS_TRIGGERS/d;/CONFIG_MAC80211_LEDS/d' common/arch/arm64/configs/gki_defconfig
          {
            echo 'CONFIG_CFG80211=m # nocheck'
            echo 'CONFIG_CFG80211_WEXT=y # nocheck'
            echo 'CONFIG_MAC80211=m # nocheck'
            echo '# CONFIG_LEDS_TRIGGERS is not set # nocheck'
            echo '# CONFIG_MAC80211_LEDS is not set # nocheck'
            echo 'CONFIG_WLAN=y # nocheck'
            echo 'CONFIG_WLAN_VENDOR_ATH=y # nocheck'
            echo 'CONFIG_ATH_CARDS=y # nocheck'
            echo 'CONFIG_ATH_COMMON=m # nocheck'
            echo 'CONFIG_ATH9K_HW=m # nocheck'
            echo 'CONFIG_ATH9K_COMMON=m # nocheck'
            echo 'CONFIG_ATH9K_HTC=m # nocheck'
            echo '# CONFIG_ATH9K_HTC_DEBUGFS is not set # nocheck'
          } > common/ath9k.fragment
          echo 'exports_files(["ath9k.fragment"])' >> common/BUILD.bazel

      - name: Build kernel modules with Bazel
        run: |
          cd kernel
          mkdir -p ../ko_out
          tools/bazel run --verbose_failures --notrim --allow_undeclared_modules --defconfig_fragment=//common:ath9k.fragment //common:kernel_aarch64_dist -- --dist_dir="$(realpath ../ko_out)"
          find -L out/ -type f \( -name "ath.ko" -o -name "ath9k_hw.ko" -o -name "ath9k_common.ko" -o -name "ath9k_htc.ko" \) -exec cp -v {} ../ko_out/ \;

      - name: Patch vermagic and exported vendor CRCs
        run: |
          python3 - << 'EOF'
          import struct, os

          def parse_elf(data):
              e_shoff = struct.unpack_from("<Q", data, 40)[0]
              e_shentsize, e_shnum, e_shstrndx = struct.unpack_from("<HHH", data, 58)
              shstr_off = struct.unpack_from("<Q", data, e_shoff + e_shstrndx * e_shentsize + 24)[0]
              secs = {}
              for i in range(e_shnum):
                  off = e_shoff + i * e_shentsize
                  sh_name, _, _, _, sh_offset, sh_size = struct.unpack_from("<IIQQQQ", data, off)
                  name = data[shstr_off + sh_name:].split(b"\0", 1)[0].decode(errors="ignore")
                  secs[name] = (off, sh_offset, sh_size)
              return secs

          def extract_exported_crcs(ko_path):
              d = open(ko_path, "rb").read()
              secs = parse_elf(d)
              crcs = {}
              # Map __ksymtab + __kcrctab and __ksymtab_gpl + __kcrctab_gpl (12-byte PREL32 entries, 4-byte u32 CRCs)
              for ktab, ctab in [("__ksymtab", "__kcrctab"), ("__ksymtab_gpl", "__kcrctab_gpl")]:
                  if ktab in secs and ctab in secs and "__ksymtab_strings" in secs:
                      _, koff, ksz = secs[ktab]
                      _, coff, csz = secs[ctab]
                      _, soff, ssz = secs["__ksymtab_strings"]
                      n = min(ksz // 12, csz // 4)
                      # Build ordered list of symbol names from __ksymtab_strings matching exported count
                      raw_strs = [s.decode(errors="ignore") for s in d[soff:soff+ssz].split(b"\0") if s]
                      # Also check ELF symtab for any __crc_ symbols
              # Direct scan: pair ordered __ksymtab_strings entries with __kcrctab + __kcrctab_gpl
              if "__ksymtab_strings" in secs:
                  _, soff, ssz = secs["__ksymtab_strings"]
                  syms = [s.decode(errors="ignore") for s in d[soff:soff+ssz].split(b"\0") if s]
                  vals = []
                  for ctab in ["__kcrctab", "__kcrctab_gpl"]:
                      if ctab in secs:
                          _, coff, csz = secs[ctab]
                          vals.extend(struct.unpack_from(f"<{csz//4}I", d, coff))
                  # Note: __ksymtab is sorted alphabetically by linker, __ksymtab_gpl is sorted alphabetically by linker!
                  gpl_count = (secs["__kcrctab_gpl"][2] // 4) if "__kcrctab_gpl" in secs else 0
                  std_count = (secs["__kcrctab"][2] // 4) if "__kcrctab" in secs else 0
                  # Match by comparing against Bazel's identical module symbol order!
                  return syms, vals
              return [], []

          # Even simpler and 100% exact: pair vendor __kcrctab values directly with Bazel's identical cfg80211.ko / mac80211.ko!
          vendor_crcs = {}
          for vp in ["cfg80211.ko", "mac80211.ko"]:
              bp = os.path.join("ko_out", vp)
              if not os.path.exists(bp):
                  continue
              vd = open(vp, "rb").read()
              bd = open(bp, "rb").read()
              vsecs = parse_elf(vd)
              bsecs = parse_elf(bd)
              # Read Bazel's exported CRCs from nm -g or __kcrctab and map index-by-index!
              for ctab in ["__kcrctab", "__kcrctab_gpl"]:
                  if ctab in vsecs and ctab in bsecs:
                      _, voff, vsz = vsecs[ctab]
                      _, boff, bsz = bsecs[ctab]
                      vvals = struct.unpack_from(f"<{vsz//4}I", vd, voff)
                      bvals = struct.unpack_from(f"<{bsz//4}I", bd, boff)
                      # Map Bazel CRC -> Vendor CRC (1-to-1 bijection of identical symbol tables!)
                      if len(vvals) == len(bvals):
                          for bv, vv in zip(bvals, vvals):
                              vendor_crcs[bv] = vv
                          print(f"{vp} {ctab}: mapped {len(vvals)} CRCs 1-to-1!")
                      else:
                          print(f"{vp} {ctab}: count mismatch vendor={len(vvals)} vs bazel={len(bvals)}")

          print("Total mapped CRC pairs:", len(vendor_crcs))

          target_vermagic = b"vermagic=6.1.157-android14-11-o-g00d81d97d759 SMP preempt mod_unload modversions aarch64\0"
          targets = ["ath.ko", "ath9k_hw.ko", "ath9k_common.ko", "ath9k_htc.ko"]

          for fn in os.listdir("ko_out"):
              path = os.path.join("ko_out", fn)
              if fn not in targets:
                  os.remove(path)
                  continue
              buf = bytearray(open(path, "rb").read())
              secs = parse_elf(buf)

              if ".modinfo" in secs:
                  hdr_off, off, sz = secs[".modinfo"]
                  modinfo = bytearray(buf[off:off+sz])
                  idx = modinfo.find(b"vermagic=")
                  if idx != -1:
                      end = modinfo.find(b"\0", idx)
                      modinfo[idx:end] = b"\0" * (end - idx)
                  new_modinfo = bytes(modinfo) + target_vermagic
                  while len(buf) % 8 != 0:
                      buf.append(0)
                  new_off = len(buf)
                  buf.extend(new_modinfo)
                  struct.pack_into("<Q", buf, hdr_off + 24, new_off)
                  struct.pack_into("<Q", buf, hdr_off + 32, len(new_modinfo))

              if "__versions" in secs:
                  _, off, sz = secs["__versions"]
                  patched = 0
                  for pos in range(off, off + sz, 64):
                      old_crc = struct.unpack_from("<Q", buf, pos)[0] & 0xffffffff
                      sym = bytes(buf[pos+8:pos+64]).split(b"\0", 1)[0].decode(errors="ignore")
                      if old_crc in vendor_crcs:
                          struct.pack_into("<Q", buf, pos, vendor_crcs[old_crc])
                          patched += 1
                          print(f"  {fn}: {sym} 0x{old_crc:08x} -> 0x{vendor_crcs[old_crc]:08x}")
                  print(f"{fn}: patched {patched} CRCs")
              open(path, "wb").write(buf)
          EOF
          modprobe --dump-modversions ko_out/ath.ko | grep wiphy_apply_custom_regulatory

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: ar9271-ko-modules
          path: ko_out/*.ko
          
