name: Build AR9271 GKI Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies and repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 repo build-essential bc bison flex libssl-dev rsync zip binutils

      - name: Sync android14-6.1 GKI kernel source
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          mkdir kernel && cd kernel
          URL=$(echo "aHR0cHM6Ly9hbmRyb2lkLmdvb2dsZXNvdXJjZS5jb20va2VybmVsL21hbmlmZXN0" | base64 -d)
          repo init -u "$URL" -b common-android14-6.1 --depth=1
          repo sync -c -j$(nproc)

      - name: Configure ath9k_htc modules
        run: |
          cd kernel
          sed -i '/CONFIG_LEDS_TRIGGERS/d;/CONFIG_MAC80211_LEDS/d' common/arch/arm64/configs/gki_defconfig
          sed -i '/select MAC80211_LEDS/d' common/drivers/net/wireless/ath/ath9k/Kconfig
          {
            echo 'CONFIG_CFG80211=m # nocheck'
            echo 'CONFIG_CFG80211_WEXT=y # nocheck'
            echo 'CONFIG_MAC80211=m # nocheck'
            echo '# CONFIG_LEDS_TRIGGERS is not set # nocheck'
            echo '# CONFIG_MAC80211_LEDS is not set # nocheck'
            echo 'CONFIG_WLAN=y # nocheck'
            echo 'CONFIG_WLAN_VENDOR_ATH=y # nocheck'
            echo 'CONFIG_ATH_CARDS=y # nocheck'
            echo 'CONFIG_ATH_COMMON=m # nocheck'
            echo 'CONFIG_ATH9K_HW=m # nocheck'
            echo 'CONFIG_ATH9K_COMMON=m # nocheck'
            echo 'CONFIG_ATH9K_HTC=m # nocheck'
            echo '# CONFIG_ATH9K_HTC_DEBUGFS is not set # nocheck'
          } > common/ath9k.fragment
          echo 'exports_files(["ath9k.fragment"])' >> common/BUILD.bazel

      - name: Build kernel modules with Bazel
        run: |
          cd kernel
          mkdir -p ../ko_out
          tools/bazel run --verbose_failures --notrim --allow_undeclared_modules --defconfig_fragment=//common:ath9k.fragment //common:kernel_aarch64_dist -- --dist_dir="$(realpath ../ko_out)"
          find -L out/ -type f \( -name "ath.ko" -o -name "ath9k_hw.ko" -o -name "ath9k_common.ko" -o -name "ath9k_htc.ko" \) -exec cp -v {} ../ko_out/ \;

      - name: Patch vermagic and exact vendor symbol CRCs
        run: |
          python3 - << 'PYEOF'
          import struct, os
          def read_cstr(data, offset):
              end = data.find(b"\0", offset)
              if end == -1:
                  end = len(data)
              return data[offset:end].decode("utf-8", errors="ignore")

          def parse_elf(data):
              e_shoff, = struct.unpack_from("<Q", data, 40)
              e_shentsize, e_shnum, e_shstrndx = struct.unpack_from("<HHH", data, 58)
              shstr_off, = struct.unpack_from("<Q", data, e_shoff + e_shstrndx * e_shentsize + 24)
              secs = dict()
              sec_list = list()
              for i in range(e_shnum):
                  off = e_shoff + i * e_shentsize
                  sh_name, sh_type, sh_flags, sh_addr, sh_offset, sh_size = struct.unpack_from("<IIQQQQ", data, off)
                  name = read_cstr(data, shstr_off + sh_name)
                  secs[name] = (off, sh_offset, sh_size)
                  sec_list.append((sh_offset, sh_size))
              return secs, sec_list

          def get_vermagic(ko_path):
              d = open(ko_path, "rb").read()
              secs, _ = parse_elf(d)
              _, off, sz = secs[".modinfo"]
              modinfo = d[off:off+sz]
              idx = modinfo.find(b"vermagic=")
              assert idx != -1, f"vermagic not found in {ko_path}"
              end = modinfo.find(b"\0", idx)
              return modinfo[idx:end+1]

          def read_vendor_sym_crcs(ko_path):
              d = open(ko_path, "rb").read()
              secs, sec_list = parse_elf(d)
              crc_map = dict()
              if ".symtab" in secs and ".strtab" in secs:
                  _, sym_off, sym_sz = secs[".symtab"]
                  _, str_off, _ = secs[".strtab"]
                  for pos in range(sym_off, sym_off + sym_sz, 24):
                      st_name, _, _, st_shndx, st_value, _ = struct.unpack_from("<IBBHQQ", d, pos)
                      if st_name:
                          name = read_cstr(d, str_off + st_name)
                          if name.startswith("__crc_") and 0 < st_shndx < len(sec_list):
                              s_off, s_sz = sec_list[st_shndx]
                              if st_value + 4 <= s_sz:
                                  crc, = struct.unpack_from("<I", d, s_off + st_value)
                                  crc_map[name[6:]] = crc
              return crc_map
          target_vermagic = get_vermagic("cfg80211.ko")
          print("Auto-detected vermagic:", target_vermagic.decode().strip("\0"))

          vendor_crcs = dict()
          for vp in ["cfg80211.ko", "mac80211.ko"]:
              extracted = read_vendor_sym_crcs(vp)
              print(f"{vp}: extracted {len(extracted)} true CRCs")
              vendor_crcs.update(extracted)

          for check_sym in ["reg_initiator_name", "wiphy_apply_custom_regulatory", "ieee80211_get_channel_khz", "freq_reg_info"]:
              val = vendor_crcs.get(check_sym)
              print(f"Verify {check_sym}:", hex(val) if val is not None else "MISSING")
              assert val is not None and val > 0xffff, f"Failed to extract valid CRC for {check_sym}"

          targets = {"ath.ko", "ath9k_hw.ko", "ath9k_common.ko", "ath9k_htc.ko"}

          for fn in os.listdir("ko_out"):
              path = os.path.join("ko_out", fn)
              if fn not in targets:
                  os.remove(path)
                  continue
              buf = bytearray(open(path, "rb").read())
              secs, _ = parse_elf(buf)

              if ".modinfo" in secs:
                  hdr_off, off, sz = secs[".modinfo"]
                  entries = [e for e in bytes(buf[off:off+sz]).split(b"\0") if e and not e.startswith(b"vermagic=")]
                  new_modinfo = b"\0".join(entries) + b"\0" + target_vermagic
                  while len(buf) % 8 != 0:
                      buf.append(0)
                  new_off = len(buf)
                  buf.extend(new_modinfo)
                  struct.pack_into("<Q", buf, hdr_off + 24, new_off)
                  struct.pack_into("<Q", buf, hdr_off + 32, len(new_modinfo))

              if "__versions" in secs:
                  _, off, sz = secs["__versions"]
                  patched = 0
                  for pos in range(off, off + sz, 64):
                      sym = read_cstr(bytes(buf[pos+8:pos+64]), 0)
                      if sym in vendor_crcs:
                          struct.pack_into("<Q", buf, pos, vendor_crcs[sym])
                          patched += 1
                  print(f"{fn}: patched {patched} CRCs")
              open(path, "wb").write(buf)
          PYEOF
          modprobe --dump-modversions ko_out/ath.ko | grep -E "reg_initiator_name|wiphy_apply_custom_regulatory|ieee80211_get_channel_khz|freq_reg_info"

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: ar9271-ko-modules
          path: ko_out/*.ko
